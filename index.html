<title>My Vinyl</title>
<style>
  @property --accent { syntax: '<color>'; inherits: true; initial-value: rgb(150, 100, 64); }
  @property --pl1    { syntax: '<color>'; inherits: true; initial-value: rgb(52, 40, 34); }
  @property --pl2    { syntax: '<color>'; inherits: true; initial-value: rgb(30, 23, 20); }
  @property --glow   { syntax: '<color>'; inherits: true; initial-value: rgba(150, 100, 64, .5); }
  @property --glow2  { syntax: '<color>'; inherits: true; initial-value: rgba(150, 100, 64, .3); }

  :root {
    color-scheme: dark;
    --s: 1; --rx: 18deg; --ry: 0deg;
    --sw: 600; --sh: 540; --hh: 64px;
    --sat: 0px; --sar: 0px; --sab: 0px; --sal: 0px;
    transition: --accent 1.6s ease, --pl1 1.6s ease, --pl2 1.6s ease, --glow 1.6s ease, --glow2 1.6s ease;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    position: fixed; inset: 0; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Helvetica Neue", sans-serif;
    color: #f0ece8; background: #0d0b0a;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  input { font: inherit; color: inherit; }
  #safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

  /* ---------- 배경: 앨범 색 오로라 (A/B 두 겹을 교차 페이드) ---------- */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #0d0b0a; pointer-events: none; }
  .aurora { position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s ease;
    --c1: rgb(120, 70, 40); --c2: rgb(70, 50, 90); --c3: rgb(40, 70, 80); }
  .aurora.on { opacity: 1; }
  .aurora i { position: absolute; width: 95vmax; height: 95vmax; border-radius: 50%; opacity: .78; will-change: transform; }
  .aurora i:nth-child(1) { left: -38vmax; top: -42vmax; background: radial-gradient(circle, var(--c1) 0%, transparent 62%); animation: dr1 28s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { right: -48vmax; top: 4vh;    background: radial-gradient(circle, var(--c2) 0%, transparent 62%); animation: dr2 34s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { left: -24vmax; bottom: -58vmax; background: radial-gradient(circle, var(--c3) 0%, transparent 62%); animation: dr3 31s ease-in-out infinite alternate; }
  @keyframes dr1 { to { transform: translate3d(16vmax, 12vmax, 0) scale(1.12); } }
  @keyframes dr2 { to { transform: translate3d(-14vmax, 10vmax, 0) scale(1.08); } }
  @keyframes dr3 { to { transform: translate3d(12vmax, -14vmax, 0) scale(1.15); } }
  .vig { position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 38%, transparent 38%, rgba(6, 5, 5, .6) 100%),
                linear-gradient(transparent 60%, rgba(0, 0, 0, .42)); }

  /* ---------- 상단 바 ---------- */
  header {
    position: absolute; inset: 0 0 auto 0; z-index: 20; height: calc(var(--hh) + var(--sat));
    padding: var(--sat) calc(16px + var(--sar)) 0 calc(16px + var(--sal));
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-weight: 700; letter-spacing: .04em; font-size: 17px; display: flex; align-items: center; gap: 10px; }
  .brand i { width: 20px; height: 20px; border-radius: 50%; display: inline-block;
    background: radial-gradient(circle, var(--accent) 0 22%, #111 24% 100%); box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  .hbtn { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.09);
    font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .2s; }
  .ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ic.f { fill: currentColor; stroke: none; }
  .hbtn { color: #e8e3df; }
  .hbtn.off { opacity: .5; }
  .hbtn.on { background: rgba(255,255,255,.24); }
  .hgroup { display: flex; gap: 8px; align-items: center; }
  .hbtn[hidden], .brand[hidden] { display: none; }
  @media (hover: hover) { .hbtn:hover { background: rgba(255,255,255,.18); } }

  /* ---------- 화면 전환 ---------- */
  .view {
    position: absolute; z-index: 1; left: 0; right: 0; top: calc(var(--hh) + var(--sat)); bottom: var(--sab);
    padding: 0 var(--sar) 0 var(--sal);
    opacity: 0; visibility: hidden; pointer-events: none; transform: scale(.985);
    transition: opacity .4s ease, transform .4s ease, visibility 0s linear .4s;
  }
  .view.active { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition-delay: 0s; }

  /* ---------- 보관함 ---------- */
  #shelf { display: flex; flex-direction: column; }
  .toolbar { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 2px 14px 0; flex: none; }
  .tabs { display: flex; gap: 4px; background: rgba(255,255,255,.08); padding: 4px; border-radius: 999px; }
  .tab { min-height: 36px; padding: 0 16px; border-radius: 999px; font-size: 13px; color: #bbb; }
  .tab.on { background: rgba(255,255,255,.18); color: #fff; }
  #searchForm input { width: 220px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(0,0,0,.35); font-size: 16px; outline: none; user-select: text; -webkit-user-select: text; }
  #searchForm input:focus { border-color: var(--accent); }

<script>

{ const m = _q.get('mode'); if (m === 'sdk' || m === 'remote' || m === 'auto') store.set('v_mode', m); }

async function api(path, opts = {}, retried = false) {

    ...opts, headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },

  if (r.status === 401 && !retried) { Auth.expire(); return api(path, opts, true); }   // 토큰이 무효화됐으면 한 번만 갱신 후 재시도

  const now = performance.now();
  if (now - miniArmAt > 1000 || miniPlayingLast !== uiPlaying) {
    miniArmAt = now; miniPlayingLast = uiPlaying;
    mini.arm.style.transform = `rotate(${uiPlaying ? 22 + 20 * progress() : 0}deg)`; mini.play.classList.toggle('pl', uiPlaying);
  }
}
$('miniBtn').onclick = toggleMini;

/* ============ 시작 ============ */
(async function boot() {
  if (location.hostname === 'localhost') { location.replace(location.href.replace('localhost', '127.0.0.1')); return; }
  $('redir').textContent = REDIRECT;
  $('deviceBtn').hidden = MODE !== 'remote';
  $('miniBtn').hidden = !('documentPictureInPicture' in window) || MODE === 'remote';
  $('volBox').hidden = !E.supportsVolume;
  updateCrackleBtn(); fit(); requestAnimationFrame(frame);
  $('cid').value = store.get('cid') || ''; $('persist').checked = store.get('v_persist') === '1';   // v4: 처음엔 '유지 안 함'이 기본
  $('modeInfo').textContent = MODE === 'sdk'
    ? '플레이어 모드: 이 화면에서 소리가 나요 (Spotify SDK 사용, Premium 필요). 요청 권한: 스트리밍, 이메일·계정 정보, 재생 상태 읽기·제어, 보관함·플레이리스트 읽기'
    : '리모컨 모드: 소리는 Spotify 앱에서 나요. 외부 스크립트 없음. 요청 권한: 계정 정보(국가·요금제), 재생 상태 읽기·제어, 보관함·플레이리스트 읽기 (스트리밍·이메일 권한 없음)';
  store.del('v_access'); store.del('v_exp'); store.del('verifier');           // v2까지 남아 있던 토큰/값 정리
  sess.del('v_rt'); sess.del('v_rt_at');                                       // v3 '로그인 유지 끔'이 sessionStorage에 남긴 값 정리

  const code = _q.get('code'), st = _q.get('state'), err = _q.get('error');
  if (location.search || location.hash) history.replaceState(null, '', location.pathname);   // 주소창의 code/state 제거
  if (err) toast('로그인 실패/취소: ' + clip(err, 60), true);
  try {
    if (code) {
      let o = null; try { o = JSON.parse(store.get('v_oauth') || 'null'); } catch {}
      store.del('v_oauth');
      if (!o || o.state !== st || Date.now() - o.t > 10 * 60e3) throw new Error('로그인 검증(state)에 실패했어요. 다시 시도해 주세요.');
      await Auth.exchange(code, o.verifier);
    } else if (!Auth.has()) { $('login').classList.add('show'); return; }
    await Auth.getToken();
    const sc = Auth.info()?.scope;                                             // 지금 모드에 필요한 권한이 토큰에 있는지 확인
    if (sc) { const have = new Set(sc.split(' ')); if (!SCOPES.split(' ').every(x => have.has(x))) { Auth.clear(); authLost('scope'); return; } }
  } catch (e) {
    if (e.code === 'AUTH') authLost(e.kind); else { toast(e.message, true); $('login').classList.add('show'); }
    return;
  }
  E.init(); loadLibrary();
})();
</script>
